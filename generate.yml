YAML
name: Generate Radheef PDF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies for WeasyPrint
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev python3-pip python3-setuptools python3-wheel python3-cffi libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run PDF Generator Script
      run: |
        python generate_pdf.py

    - name: Upload PDF to GitHub Releases / Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: Complete-Dhivehi-Radheef-PDF
        path: full_radheef_dictionary.pdf
